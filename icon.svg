<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Subtle Glow -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0b24a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Glossy Gold Gradient for the T -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe8c0"/>
      <stop offset="30%" stop-color="#f0b24a"/>
      <stop offset="70%" stop-color="#c88020"/>
      <stop offset="100%" stop-color="#8a5a1a"/>
    </linearGradient>

    <!-- Darker Gold for the 3D Extrusion -->
    <linearGradient id="gold-extrude" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4802a"/>
      <stop offset="100%" stop-color="#6a3a0a"/>
    </linearGradient>

    <!-- Eye Glow Effect -->
    <filter id="eye-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for the T -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Rounded Square Background (Play Store Style) -->
  <rect width="512" height="512" rx="112" fill="#0f172a" />
  
  <!-- Soft Orange Glow behind the T -->
  <circle cx="256" cy="256" r="220" fill="url(#bg-glow)" />

  <!-- Minimal AI Robot Face -->
  <g>
    <!-- Head shape -->
    <rect x="156" y="116" width="200" height="280" rx="70" fill="#1e293b" stroke="#334155" stroke-width="4" />
    <!-- Antenna -->
    <line x1="256" y1="116" x2="256" y2="80" stroke="#334155" stroke-width="6" stroke-linecap="round" />
    <circle cx="256" cy="76" r="10" fill="#f0b24a" />
    <!-- Glowing Orange Eyes -->
    <rect x="196" y="210" width="30" height="16" rx="8" fill="#f0b24a" filter="url(#eye-glow)" />
    <rect x="286" y="210" width="30" height="16" rx="8" fill="#f0b24a" filter="url(#eye-glow)" />
    <!-- Minimal Mouth -->
    <path d="M 236 300 Q 256 316 276 300" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- The 3D Glossy 'T' -->
  <g filter="url(#drop-shadow)">
    <!-- Extrusion (Back Face) for 3D Depth -->
    <path d="M 130 130 L 382 130 L 382 200 L 290 200 L 290 386 L 222 386 L 222 200 L 130 200 Z" fill="url(#gold-extrude)" transform="translate(12, 12)" />
    
    <!-- Front Face -->
    <path d="M 130 130 L 382 130 L 382 200 L 290 200 L 290 386 L 222 386 L 222 200 L 130 200 Z" fill="url(#gold)" />
    
    <!-- Glossy Highlight Reflection -->
    <path d="M 130 130 L 382 130 L 382 160 L 130 160 Z" fill="rgba(255,255,255,0.15)" />
  </g>
</svg>